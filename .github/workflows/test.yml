name: Tests and OpenWrt IPK packages
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: make check arm64 smoke
  openwrt-sdk:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false
      - name: Install SDK host prerequisites
        run: sudo apt-get update && sudo apt-get install -y libncurses-dev zstd gawk rsync
      - name: Build with official OpenWrt 24.10.2 SDK
        run: make packages
      - uses: actions/upload-artifact@v4
        with:
          name: openwrt-24.10.2-aarch64-cortex-a53
          path: build/packages/*.ipk
          if-no-files-found: error
